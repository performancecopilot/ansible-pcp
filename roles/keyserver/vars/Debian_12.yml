---
# Put internal variables here with Debian 12 specific values.

# Debian 12 still ships Redis instead of Valkey.
__keyserver_name: redis
# systemctl enable refuses the redis.service alias, use the unit name.
__keyserver_service_name: redis-server
__keyserver_conf_path: /etc/redis
__keyserver_conf_file: redis.conf

__keyserver_packages:
  - redis-tools
  - redis-server

__keyserver_packages_extra: []
__keyserver_loaded_modules: []
