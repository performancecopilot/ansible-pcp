---

- name: Restart pmcd
  service:
    name: pmcd
    state: restarted
  when: __pcp_is_booted | bool

- name: Restart pmie
  service:
    name: pmie
    state: restarted
  when: __pcp_is_booted | bool

- name: Restart pmproxy
  include_tasks: tasks/restart_pmproxy.yml
