---
- name: Check installed PCP version
  when: >-
    pcp_push_client.enabled | default(false) or
    pcp_push_collector.enabled | default(false)
  block:
    - name: Read installed PCP version
      command: pminfo -V
      changed_when: false
      failed_when: false
      check_mode: false
      register: __pcp_push_version

    - name: Record installed PCP version
      set_fact:
        __pcp_push_detected_version: >-
          {{ ((__pcp_push_version.stdout | default('')) ~
              (__pcp_push_version.stderr | default(''))) |
             regex_search('[0-9]+\.[0-9]+\.[0-9]+') |
             default('unknown', true) }}

    - name: Record whether the installed PCP version is too old
      set_fact:
        __pcp_push_version_too_old: >-
          {{ __pcp_push_version.rc | default(1) == 0 and
             __pcp_push_detected_version != 'unknown' and
             __pcp_push_detected_version is version('7.2.2', '<') }}

    - name: Require PCP 7.2.2 for archive push
      assert:
        that:
          - __pcp_push_version.rc == 0
          - __pcp_push_detected_version != 'unknown'
          - >-
            not __pcp_push_version_too_old | bool or
            not pcp_fail_if_too_old | default(true) | bool
        fail_msg: >-
          Detected PCP {{ __pcp_push_detected_version }}; push requires
          PCP >= 7.2.2. Upgrade PCP from your distribution or the upstream
          PCP repository before enabling push.
      when: not ansible_check_mode or __pcp_push_version.rc | default(1) == 0

    - name: Report unsupported PCP version before skipping the host
      debug:
        msg: >-
          Skipping archive push on this host: detected PCP
          {{ __pcp_push_detected_version }}; push requires PCP >= 7.2.2.
          Upgrade PCP from your distribution or the upstream PCP repository.
      when:
        - __pcp_push_version_too_old | bool
        - not pcp_fail_if_too_old | default(true) | bool

    - name: End this host's play when PCP is too old for push
      meta: end_host
      when:
        - __pcp_push_version_too_old | bool
        - not pcp_fail_if_too_old | default(true) | bool
