---

- name: Ensure REST API, proxy and metric log discovery is configured
  template:
    src: pmproxy.defaults.j2
    dest: "{{ __pcp_pmproxy_defaults_path }}"
    mode: "0644"
  register: __pcp_pmproxy_configuration_result
  notify: Restart pmproxy
  when: pcp_rest_api | bool

- name: Remember pending pmproxy configuration changes
  set_fact:
    __pcp_pmproxy_restart_pending: >-
      {{ __pcp_pmproxy_restart_pending | default(false) | bool or
         __pcp_pmproxy_configuration_result is changed }}

- name: Set push listener reachability while preserving other defaults
  lineinfile:
    path: "{{ __pcp_pmproxy_defaults_path }}"
    regexp: '^PMPROXY_LOCAL='
    line: "PMPROXY_LOCAL={{ pcp_pmproxy_localonly }}"
    create: true
    mode: "0644"
  register: __pcp_pmproxy_configuration_result
  notify: Restart pmproxy
  when:
    - not pcp_rest_api | bool
    - pcp_push_collector.enabled | default(false) | bool

- name: Remember pending pmproxy configuration changes
  set_fact:
    __pcp_pmproxy_restart_pending: >-
      {{ __pcp_pmproxy_restart_pending | default(false) | bool or
         __pcp_pmproxy_configuration_result is changed }}

- name: Configure push collection independently of REST queries
  include_tasks: push_collector.yml
  when: pcp_push_collector | length > 0

- name: Ensure REST API, proxy and log discovery is running and enabled on boot
  service:
    name: pmproxy
    state: "{{ 'started' if __pcp_is_booted else omit }}"
    enabled: true
  when: >-
    pcp_rest_api | bool or pcp_push_collector.enabled | default(false) | bool
