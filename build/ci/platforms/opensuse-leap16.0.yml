  tests_default.yml: collection has no openSUSE support
  tests_verify_basic.yml: collection has no openSUSE support
  tests_verify_postfix.yml: collection has no openSUSE support
  tests_verify_repository.yml: collection has no openSUSE support
  tests_verify_retention.yml: collection has no openSUSE support
  tests_verify_spark.yml: collection has no openSUSE support
