# SPDX-License-Identifier: MIT
---
name: openSUSE Leap 15.6
base_image: registry.opensuse.org/opensuse/leap:15.6
# Leap 15.6 ships Python 3.6 as python3, which is too old for the modules of a
# current ansible-core, so use the newer interpreter of the distribution.
packages:
  - python311
python_interpreter: /usr/bin/python3.11
groups:
  - all
skip:
  # The distribution perl-PCP-PMDA 6.2.0 cannot load its PMDA.so (undefined
  # symbol pmdaFetch), so the postfix agent does not install.
  tests_verify_postfix.yml: perl-PCP-PMDA cannot load PMDA.so
  # The repository role has no vars/Suse.yml, so its tasks fail on undefined
  # variables.  Remove this entry once the role supports openSUSE.
  tests_verify_repository.yml: repository role has no openSUSE support
