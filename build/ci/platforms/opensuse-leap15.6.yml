# SPDX-License-Identifier: MIT
---
name: openSUSE Leap 15.6
base_image: registry.opensuse.org/opensuse/leap:15.6
# Leap 15.6 ships Python 3.6 as python3, which is too old for the modules of a
# current ansible-core, so use the newer interpreter of the distribution.
packages:
  - python311
python_interpreter: /usr/bin/python3.11
groups:
  - all
skip:
  # The collection has no openSUSE support yet: the pcp, keyserver, repository
  # and spark roles have no vars/Suse.yml, so their tasks fail on undefined
  # variables.  Remove these entries once SUSE support is implemented.
  tests_default.yml: collection has no openSUSE support
  tests_verify_basic.yml: collection has no openSUSE support
  tests_verify_postfix.yml: collection has no openSUSE support
  tests_verify_repository.yml: collection has no openSUSE support
  tests_verify_retention.yml: collection has no openSUSE support
  tests_verify_spark.yml: collection has no openSUSE support
