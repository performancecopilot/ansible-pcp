---
# yamllint disable rule:line-length
name: tox
on:  # yamllint disable-line rule:truthy
  - pull_request
  - push
env:
  TOX_LSR: "git+https://github.com/linux-system-roles/tox-lsr@3.21.0"
  LSR_ROLE2COLL_NAMESPACE: performancecopilot
  LSR_ROLE2COLL_NAME: metrics
  LSR_ANSIBLE_TEST_DOCKER: "true"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  python:
    strategy:
      matrix:
        pyver_os:
          - ver: '3.12'
            os: ubuntu-24.04
    runs-on: ${{ matrix.pyver_os.os }}
    steps:
      - name: checkout PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver_os.ver }}
      - name: Install platform dependencies, python, tox, tox-lsr
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y git
          pip install "$TOX_LSR"
          lsr_ci_preinstall
      - name: Run tox tests
        run: |
          set -euxo pipefail
          # collection must run before ansible-test, it prepares the
          # collection tree that ansible-test copies and tests
          TOXENV="collection,ansible-test,shellcheck,ansible-managed-var-comment" lsr_ci_runtox
